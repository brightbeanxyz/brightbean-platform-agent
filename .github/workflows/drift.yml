# Checks that this repo still describes the live BrightBean API (scripts/check-drift.mjs).
# - Pull requests: static checks, plus docs coverage of the committed snapshots. No network,
#   so a PR's result depends only on its own content.
# - Weekly and on demand: the same, plus the live OpenAPI spec and, when the
#   BRIGHTBEAN_API_KEY secret is set (a key with every permission), the MCP tools/list.
name: drift

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: |
          python3 -m py_compile examples/python/*.py
          for f in examples/node/*.mjs scripts/*.mjs; do node --check "$f"; done
          for f in examples/shell/*.sh; do bash -n "$f"; done
      - name: Docs cover the snapshots
        if: github.event_name == 'pull_request'
        run: node scripts/check-drift.mjs --offline
      - name: Drift against the live API
        if: github.event_name != 'pull_request'
        env:
          BRIGHTBEAN_API_KEY: ${{ secrets.BRIGHTBEAN_API_KEY }}
        run: node scripts/check-drift.mjs
