# Weekly check that this repo still describes the live BrightBean API.
# Runs scripts/check-drift.mjs: the OpenAPI snapshot, docs coverage and, when the
# BRIGHTBEAN_API_KEY secret is set (a key with every permission), the MCP tools/list.
name: drift

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: |
          python3 -m py_compile examples/python/*.py
          for f in examples/node/*.mjs scripts/*.mjs; do node --check "$f"; done
          for f in examples/shell/*.sh; do bash -n "$f"; done
      - name: Drift check
        env:
          BRIGHTBEAN_API_KEY: ${{ secrets.BRIGHTBEAN_API_KEY }}
        run: node scripts/check-drift.mjs
